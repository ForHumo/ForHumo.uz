<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
<title>Humo Pay</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;}
:root{
  --bg:#0f1117;--bg2:#161b25;--s1:#1e2535;--s2:#252d3d;
  --b1:rgba(255,255,255,.08);--b2:rgba(255,255,255,.14);
  --t1:#f0f4ff;--t2:#a8b4cc;--t3:#5e6e8a;
  --card-a:#0d7a5f;--card-b:#0a5e8a;--card-c:#0d9e6e;
  --green:#22c55e;--red:#f87171;--blue:#60a5fa;
  --accent:#10b981;--accent2:#059669;
  --toast-bg:#1e2535;
  --modal-bg:rgba(0,0,0,.7);
}
.light{
  --bg:#f0f4f8;--bg2:#ffffff;--s1:#e8edf4;--s2:#dde4ee;
  --b1:rgba(0,0,0,.08);--b2:rgba(0,0,0,.14);
  --t1:#0f1a2e;--t2:#3d5068;--t3:#7a8fa8;
  --toast-bg:#ffffff;
  --modal-bg:rgba(0,0,0,.5);
}

body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:var(--bg);color:var(--t1);min-height:100vh;transition:background .3s,color .3s;}

/* TOPBAR */
.topbar{display:flex;align-items:center;justify-content:space-between;padding:14px 20px;background:var(--bg2);border-bottom:1px solid var(--b1);position:sticky;top:0;z-index:50;transition:background .3s,border-color .3s;}
.tb-logo{display:flex;align-items:center;gap:8px;}
.tb-logo-icon{width:32px;height:32px;border-radius:9px;background:linear-gradient(135deg,var(--card-a),var(--card-b));display:flex;align-items:center;justify-content:center;flex-shrink:0;}
.tb-logo-icon svg{width:17px;height:17px;fill:#fff;}
.tb-logo-text{font-size:16px;font-weight:800;letter-spacing:-.3px;color:var(--t1);}
.tb-logo-text span{color:var(--accent);}
.tb-controls{display:flex;align-items:center;gap:6px;}
.ctrl-btn{height:32px;padding:0 10px;border-radius:8px;border:1px solid var(--b1);background:var(--s1);color:var(--t2);font-size:12px;font-weight:600;cursor:pointer;transition:background .15s,color .15s,border-color .15s;font-family:inherit;touch-action:manipulation;-webkit-tap-highlight-color:transparent;}
.ctrl-btn:hover{background:var(--s2);color:var(--t1);}
.ctrl-btn.active{background:var(--accent);border-color:var(--accent);color:#fff;}

/* MAIN */
.main{max-width:480px;margin:0 auto;padding:20px 16px 100px;}

/* CARD */
.pay-card-wrap{margin-bottom:24px;}
.pay-card{
  width:100%;aspect-ratio:1.586;border-radius:20px;padding:22px 22px 20px;
  background:linear-gradient(135deg,#0d4e3a 0%,#0a3d5c 40%,#0d6e4a 100%);
  position:relative;overflow:hidden;box-shadow:0 16px 48px rgba(0,0,0,.45);
  display:flex;flex-direction:column;justify-content:space-between;
  user-select:none;
}
.pay-card::before{
  content:'';position:absolute;top:-60px;right:-60px;
  width:220px;height:220px;border-radius:50%;
  background:rgba(255,255,255,.05);
}
.pay-card::after{
  content:'';position:absolute;bottom:-80px;left:-40px;
  width:260px;height:260px;border-radius:50%;
  background:rgba(16,185,129,.07);
}
.card-top{display:flex;align-items:flex-start;justify-content:space-between;position:relative;z-index:1;}
.card-brand{font-size:14px;font-weight:800;letter-spacing:.5px;color:rgba(255,255,255,.9);}
.card-brand span{color:rgba(255,255,255,.55);}
.card-chip{width:36px;height:27px;border-radius:5px;background:linear-gradient(135deg,#d4a843,#f0c060,#d4a843);position:relative;overflow:hidden;}
.card-chip::before{content:'';position:absolute;inset:0;background:repeating-linear-gradient(90deg,transparent,transparent 5px,rgba(0,0,0,.12) 5px,rgba(0,0,0,.12) 6px);}
.card-chip::after{content:'';position:absolute;inset:0;background:repeating-linear-gradient(180deg,transparent,transparent 8px,rgba(0,0,0,.08) 8px,rgba(0,0,0,.08) 9px);}
.card-mid{position:relative;z-index:1;}
.card-balance-lbl{font-size:10px;color:rgba(255,255,255,.5);letter-spacing:.8px;text-transform:uppercase;margin-bottom:4px;}
.card-balance{font-size:28px;font-weight:800;color:#fff;letter-spacing:-1px;line-height:1;}
.card-balance .currency{font-size:14px;font-weight:600;opacity:.7;margin-left:3px;}
.card-bottom{display:flex;align-items:flex-end;justify-content:space-between;position:relative;z-index:1;}
.card-number{font-family:'Courier New',monospace;font-size:13px;color:rgba(255,255,255,.6);letter-spacing:2px;}
.card-holder{text-align:right;}
.card-holder-lbl{font-size:8px;color:rgba(255,255,255,.4);letter-spacing:.5px;text-transform:uppercase;}
.card-holder-name{font-size:11px;font-weight:600;color:rgba(255,255,255,.8);letter-spacing:.5px;text-transform:uppercase;}
.card-nfc{position:absolute;right:20px;top:50%;transform:translateY(-50%);z-index:1;opacity:.5;}
.card-nfc svg{width:22px;height:22px;fill:none;stroke:#fff;stroke-width:2;}

/* QUICK ACTIONS */
.section-title{font-size:13px;font-weight:700;color:var(--t3);letter-spacing:.5px;text-transform:uppercase;margin-bottom:12px;}
.quick-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:24px;}
.qbtn{
  display:flex;flex-direction:column;align-items:center;gap:6px;
  padding:14px 8px;border-radius:14px;border:1px solid var(--b1);
  background:var(--s1);cursor:pointer;transition:background .15s,border-color .15s,transform .1s;
  touch-action:manipulation;-webkit-tap-highlight-color:transparent;
}
.qbtn:hover{background:var(--s2);border-color:var(--b2);}
.qbtn:active{transform:scale(.96);}
.qbtn-icon{font-size:24px;line-height:1;}
.qbtn-name{font-size:11.5px;font-weight:600;color:var(--t2);text-align:center;line-height:1.2;}
.qbtn-price{font-size:10.5px;color:var(--t3);}

/* CUSTOM SPEND */
.custom-spend{background:var(--s1);border:1px solid var(--b1);border-radius:16px;padding:16px;margin-bottom:24px;transition:background .3s,border-color .3s;}
.cs-row{display:flex;gap:10px;align-items:center;}
.cs-inp{
  flex:1;background:var(--bg2);border:1px solid var(--b2);border-radius:10px;
  padding:10px 14px;font-size:15px;font-weight:700;color:var(--t1);
  font-family:inherit;outline:none;transition:border-color .2s,background .3s,color .3s;
}
.cs-inp:focus{border-color:var(--accent);}
.cs-inp::placeholder{color:var(--t3);font-weight:400;}
.cs-btn{
  padding:10px 18px;border-radius:10px;border:none;background:var(--accent);
  color:#fff;font-size:13px;font-weight:700;cursor:pointer;white-space:nowrap;
  transition:opacity .15s,transform .1s;font-family:inherit;
  touch-action:manipulation;-webkit-tap-highlight-color:transparent;
}
.cs-btn:hover{opacity:.88;}
.cs-btn:active{transform:scale(.97);}
.cs-label{font-size:12px;color:var(--t3);margin-bottom:10px;}

/* TOPUP BTN */
.topup-row{display:flex;justify-content:center;margin-bottom:24px;}
.topup-btn{
  display:flex;align-items:center;gap:8px;padding:12px 24px;
  border-radius:12px;border:1px solid var(--accent);
  background:rgba(16,185,129,.1);color:var(--accent);
  font-size:13px;font-weight:700;cursor:pointer;font-family:inherit;
  transition:background .15s,transform .1s;
  touch-action:manipulation;-webkit-tap-highlight-color:transparent;
}
.topup-btn:hover{background:rgba(16,185,129,.18);}
.topup-btn:active{transform:scale(.97);}
.topup-btn svg{width:16px;height:16px;fill:none;stroke:currentColor;stroke-width:2.5;}

/* TRANSACTIONS */
.txn-list{display:flex;flex-direction:column;gap:8px;margin-bottom:24px;}
.txn-item{
  display:flex;align-items:center;gap:12px;
  background:var(--s1);border:1px solid var(--b1);border-radius:13px;
  padding:12px 14px;transition:background .3s,border-color .3s;
}
.txn-icon{font-size:22px;width:40px;height:40px;border-radius:11px;background:var(--bg2);display:flex;align-items:center;justify-content:center;flex-shrink:0;border:1px solid var(--b1);transition:background .3s,border-color .3s;}
.txn-info{flex:1;min-width:0;}
.txn-title{font-size:13px;font-weight:600;color:var(--t1);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;transition:color .3s;}
.txn-date{font-size:11px;color:var(--t3);margin-top:2px;}
.txn-amount{font-size:14px;font-weight:800;white-space:nowrap;}
.txn-amount.pos{color:var(--green);}
.txn-amount.neg{color:var(--red);}

.empty-txn{text-align:center;padding:32px 16px;color:var(--t3);font-size:13px;}

/* MODAL */
.modal-overlay{
  position:fixed;inset:0;background:var(--modal-bg);z-index:100;
  display:flex;align-items:flex-end;justify-content:center;
  opacity:0;pointer-events:none;transition:opacity .2s;
}
.modal-overlay.open{opacity:1;pointer-events:all;}
.modal{
  background:var(--bg2);border-radius:24px 24px 0 0;padding:24px;width:100%;max-width:480px;
  transform:translateY(100%);transition:transform .28s cubic-bezier(.32,.72,0,1);
  border:1px solid var(--b1);border-bottom:none;max-height:80vh;overflow-y:auto;
}
.modal-overlay.open .modal{transform:translateY(0);}
.modal-handle{width:40px;height:4px;border-radius:2px;background:var(--b2);margin:0 auto 18px;}
.modal-title{font-size:16px;font-weight:800;color:var(--t1);margin-bottom:16px;text-align:center;}
.modal-presets{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:14px;}
.preset-btn{
  padding:12px 8px;border-radius:11px;border:1px solid var(--b1);
  background:var(--s1);color:var(--t1);font-size:13px;font-weight:700;
  cursor:pointer;transition:background .15s,border-color .15s,transform .1s;font-family:inherit;
  touch-action:manipulation;-webkit-tap-highlight-color:transparent;
}
.preset-btn:hover{background:var(--s2);border-color:var(--accent);}
.preset-btn:active{transform:scale(.96);}
.modal-inp-row{display:flex;gap:8px;margin-bottom:6px;}
.modal-inp{
  flex:1;background:var(--s1);border:1px solid var(--b1);border-radius:10px;
  padding:10px 14px;font-size:15px;font-weight:700;color:var(--t1);
  font-family:inherit;outline:none;transition:border-color .2s;
}
.modal-inp:focus{border-color:var(--accent);}
.modal-inp::placeholder{color:var(--t3);font-weight:400;}
.modal-confirm{
  width:100%;padding:13px;border-radius:12px;border:none;
  background:var(--accent);color:#fff;font-size:14px;font-weight:800;
  cursor:pointer;font-family:inherit;transition:opacity .15s;margin-top:10px;
  touch-action:manipulation;-webkit-tap-highlight-color:transparent;
}
.modal-confirm:hover{opacity:.88;}
.modal-close{
  position:absolute;top:16px;right:18px;width:28px;height:28px;
  border-radius:50%;border:none;background:var(--s1);color:var(--t2);
  cursor:pointer;font-size:16px;display:flex;align-items:center;justify-content:center;
  font-family:inherit;touch-action:manipulation;
}
.modal-inner{position:relative;}

/* TOAST */
.toast-wrap{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);z-index:200;display:flex;flex-direction:column;gap:8px;align-items:center;pointer-events:none;}
.toast{
  background:var(--toast-bg);border:1px solid var(--b2);border-radius:12px;
  padding:10px 18px;font-size:13px;font-weight:600;color:var(--t1);
  box-shadow:0 8px 32px rgba(0,0,0,.3);white-space:nowrap;
  animation:toastIn .25s ease-out;transition:opacity .3s,transform .3s;
}
.toast.ok{border-color:rgba(34,197,94,.4);color:var(--green);}
.toast.err{border-color:rgba(248,113,113,.4);color:var(--red);}
.toast.out{opacity:0;transform:translateY(8px);}
@keyframes toastIn{from{opacity:0;transform:translateY(12px);}to{opacity:1;transform:translateY(0);}}

/* DIVIDER */
.divider{height:1px;background:var(--b1);margin:0 0 20px;transition:background .3s;}

@media(max-width:400px){
  .quick-grid{grid-template-columns:repeat(3,1fr);}
  .card-balance{font-size:22px;}
}
</style>
</head>
<body>

<div class="topbar">
  <div class="tb-logo">
    <div class="tb-logo-icon">
      <svg viewBox="0 0 24 24"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm-1 14H9V8h2v8zm4 0h-2V8h2v8z"/></svg>
    </div>
    <span class="tb-logo-text">Humo <span>Pay</span></span>
  </div>
  <div class="tb-controls">
    <button class="ctrl-btn" id="btnUZ" onclick="setLang('uz')">UZ</button>
    <button class="ctrl-btn" id="btnRU" onclick="setLang('ru')">RU</button>
    <button class="ctrl-btn" id="btnEN" onclick="setLang('en')">EN</button>
    <button class="ctrl-btn" id="btnTheme" onclick="toggleTheme()">🌙</button>
  </div>
</div>

<div class="main">

  <!-- Virtual Card -->
  <div class="pay-card-wrap">
    <div class="pay-card">
      <div class="card-top">
        <div class="card-brand">Humo <span>Pay</span></div>
        <div class="card-chip"></div>
      </div>
      <div class="card-mid">
        <div class="card-balance-lbl" di="card_balance_lbl">BALANS</div>
        <div class="card-balance"><span id="cardBalance">800 000</span><span class="currency">UZS</span></div>
      </div>
      <div class="card-nfc">
        <svg viewBox="0 0 24 24"><path d="M6.2 6.2C4.8 7.6 4 9.7 4 12s.8 4.4 2.2 5.8l-1.4 1.4C3 17.5 2 14.9 2 12s1-5.5 2.8-7.2L6.2 6.2zm11.6 0l1.4-1.4C21 6.5 22 9.1 22 12s-1 5.5-2.8 7.2l-1.4-1.4C19.2 16.4 20 14.3 20 12s-.8-4.4-1.8-5.8zM9 9c-.8.8-1.3 2-1.3 3s.5 2.2 1.3 3l-1.4 1.4C6.5 14.9 6 13.5 6 12s.5-2.9 1.6-4L9 9zm7.4-1.4C17.5 9.1 18 10.5 18 12s-.5 2.9-1.6 4L15 14.6c.8-.8 1.3-2 1.3-3s-.5-2.2-1.3-3L16.4 7.6zM12 10a2 2 0 100 4 2 2 0 000-4z"/></svg>
      </div>
      <div class="card-bottom">
        <div class="card-number">•••• •••• •••• 4821</div>
        <div class="card-holder">
          <div class="card-holder-lbl">CARD HOLDER</div>
          <div class="card-holder-name">HUMO USER</div>
        </div>
      </div>
    </div>
  </div>

  <!-- Top Up -->
  <div class="topup-row">
    <button class="topup-btn" onclick="openTopUp()">
      <svg viewBox="0 0 24 24"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
      <span di="topup_btn">Balansni to'ldirish</span>
    </button>
  </div>

  <!-- Quick Spend -->
  <div class="section-title" di="quick_title">TEZKOR TO'LOV</div>
  <div class="quick-grid" id="quickGrid"></div>

  <!-- Custom Spend -->
  <div class="custom-spend">
    <div class="cs-label" di="custom_label">Ixtiyoriy miqdorda sarflash</div>
    <div class="cs-row">
      <input class="cs-inp" id="csInp" type="number" min="1" step="1000" di_ph="custom_ph">
      <button class="cs-btn" onclick="doCustomSpend()" di="custom_btn">To'lash</button>
    </div>
  </div>

  <div class="divider"></div>

  <!-- Transactions -->
  <div class="section-title" di="txn_title">SO'NGGI AMALLAR</div>
  <div class="txn-list" id="txnList"></div>

</div>

<!-- Top-Up Modal -->
<div class="modal-overlay" id="topupModal" onclick="closeTopUp(event)">
  <div class="modal">
    <div class="modal-handle"></div>
    <div class="modal-inner">
      <div class="modal-title" di="topup_title">Balansni to'ldirish</div>
      <div class="modal-presets" id="presetGrid"></div>
      <div class="modal-inp-row">
        <input class="modal-inp" id="topupInp" type="number" min="1000" step="1000" di_ph="topup_ph">
      </div>
      <button class="modal-confirm" onclick="doTopUp()" di="topup_confirm">To'ldirish</button>
    </div>
  </div>
</div>

<!-- Toast -->
<div class="toast-wrap" id="toastWrap"></div>

<script>
// ─── CONSTANTS ───────────────────────────────────────────────────────────────
const BAL_KEY='hmpay_balance';
const TXN_KEY='hmpay_txns';
const LANG_KEY='hmpay_lang';
const THEME_KEY='hmpay_theme';

const SEED_TXNS=[
  {id:'t5',type:'expense',icon:'🍕',title_uz:"Ovqat: Pizza yetkazib berish",title_ru:"Еда: Доставка пиццы",title_en:"Food: Pizza delivery",amount:-20000,ts:Date.now()-2*24*3600*1000},
  {id:'t4',type:'expense',icon:'☕',title_uz:"Kafe: Kofe va pastry",title_ru:"Кафе: Кофе и выпечка",title_en:"Café: Coffee & pastry",amount:-15000,ts:Date.now()-5*24*3600*1000},
  {id:'t3',type:'expense',icon:'📦',title_uz:"Humo Market: Kitob to'plami",title_ru:"Humo Market: Набор книг",title_en:"Humo Market: Book set",amount:-30000,ts:Date.now()-8*24*3600*1000},
  {id:'t2',type:'expense',icon:'🎮',title_uz:"eSport: Autumn Cup ro'yxat",title_ru:"eSport: Регистрация Autumn Cup",title_en:"eSport: Autumn Cup entry",amount:-50000,ts:Date.now()-12*24*3600*1000},
  {id:'t1',type:'expense',icon:'🛒',title_uz:"Humo Market: Telefon qoplamasi",title_ru:"Humo Market: Чехол для телефона",title_en:"Humo Market: Phone case",amount:-85000,ts:Date.now()-20*24*3600*1000},
  {id:'t0',type:'income',icon:'💳',title_uz:"Boshlang'ich balans",title_ru:"Начальный баланс",title_en:"Starting balance",amount:1000000,ts:Date.now()-30*24*3600*1000},
];
const INIT_BAL=800000;

const QUICK_ITEMS=[
  {icon:'🛒',key_uz:'Humo Market',key_ru:'Humo Market',key_en:'Humo Market',price:35000},
  {icon:'🎮',key_uz:'eSport',key_ru:'eSport',key_en:'eSport',price:50000},
  {icon:'☕',key_uz:'Kafe',key_ru:'Кафе',key_en:'Café',price:18000},
  {icon:'🍕',key_uz:'Ovqat',key_ru:'Еда',key_en:'Food',price:22000},
  {icon:'🎬',key_uz:'Kino',key_ru:'Кино',key_en:'Cinema',price:40000},
  {icon:'🚚',key_uz:'Yetkazish',key_ru:'Доставка',key_en:'Delivery',price:15000},
];

const TOPUP_PRESETS=[50000,100000,200000,500000,1000000,2000000];

const I18N={
  uz:{
    card_balance_lbl:'BALANS',
    topup_btn:"Balansni to'ldirish",
    quick_title:'TEZKOR TO\'LOV',
    custom_label:'Ixtiyoriy miqdorda sarflash',
    custom_ph:'Miqdor (UZS)...',
    custom_btn:"To'lash",
    txn_title:"SO'NGGI AMALLAR",
    topup_title:"Balansni to'ldirish",
    topup_ph:'Miqdor kiriting...',
    topup_confirm:"To'ldirish",
    toast_spent:'sarflandi',
    toast_added:"qo'shildi",
    toast_no_funds:'Balans yetarli emas!',
    toast_invalid:'Noto\'g\'ri miqdor',
    toast_min:'Minimal 1 000 UZS',
    empty_txn:"Hali amal yo'q",
    price_suffix:'so\'m',
  },
  ru:{
    card_balance_lbl:'БАЛАНС',
    topup_btn:'Пополнить баланс',
    quick_title:'БЫСТРЫЙ ПЛАТЁЖ',
    custom_label:'Произвольная сумма',
    custom_ph:'Сумма (UZS)...',
    custom_btn:'Оплатить',
    txn_title:'ПОСЛЕДНИЕ ОПЕРАЦИИ',
    topup_title:'Пополнение баланса',
    topup_ph:'Введите сумму...',
    topup_confirm:'Пополнить',
    toast_spent:'потрачено',
    toast_added:'добавлено',
    toast_no_funds:'Недостаточно средств!',
    toast_invalid:'Неверная сумма',
    toast_min:'Минимум 1 000 UZS',
    empty_txn:'Нет операций',
    price_suffix:'сум',
  },
  en:{
    card_balance_lbl:'BALANCE',
    topup_btn:'Top Up Balance',
    quick_title:'QUICK PAY',
    custom_label:'Custom amount',
    custom_ph:'Amount (UZS)...',
    custom_btn:'Pay',
    txn_title:'RECENT TRANSACTIONS',
    topup_title:'Top Up Balance',
    topup_ph:'Enter amount...',
    topup_confirm:'Top Up',
    toast_spent:'spent',
    toast_added:'added',
    toast_no_funds:'Insufficient balance!',
    toast_invalid:'Invalid amount',
    toast_min:'Minimum 1 000 UZS',
    empty_txn:'No transactions yet',
    price_suffix:'sum',
  }
};

// ─── STATE ───────────────────────────────────────────────────────────────────
let BAL=INIT_BAL;
let TXNS=[...SEED_TXNS];
let LANG='uz';
let DARK=true;

// ─── INIT ────────────────────────────────────────────────────────────────────
function init(){
  // Load theme
  const th=localStorage.getItem(THEME_KEY);
  DARK=th?th==='dark':true;
  applyTheme();

  // Load lang
  const lg=localStorage.getItem(LANG_KEY)||'uz';
  LANG=lg;

  // Load balance
  const b=localStorage.getItem(BAL_KEY);
  if(b!==null){BAL=parseFloat(b)||0;}else{localStorage.setItem(BAL_KEY,BAL);}

  // Load txns
  const t=localStorage.getItem(TXN_KEY);
  if(t){try{TXNS=JSON.parse(t);}catch(e){TXNS=[...SEED_TXNS];saveTxns();}}
  else{TXNS=[...SEED_TXNS];saveTxns();}

  buildQuickGrid();
  buildPresets();
  applyLang();
  renderCard();
  renderTxns();
}

// ─── PERSISTENCE ─────────────────────────────────────────────────────────────
function saveBal(){localStorage.setItem(BAL_KEY,BAL);}
function saveTxns(){try{localStorage.setItem(TXN_KEY,JSON.stringify(TXNS));}catch(e){}}

// ─── THEME ───────────────────────────────────────────────────────────────────
function toggleTheme(){
  DARK=!DARK;
  localStorage.setItem(THEME_KEY,DARK?'dark':'light');
  applyTheme();
}
function applyTheme(){
  document.body.classList.toggle('light',!DARK);
  document.getElementById('btnTheme').textContent=DARK?'☀️':'🌙';
}

// ─── LANG ────────────────────────────────────────────────────────────────────
function setLang(l){
  LANG=l;
  localStorage.setItem(LANG_KEY,l);
  applyLang();
  renderTxns();
  buildQuickGrid();
}
function applyLang(){
  const t=I18N[LANG]||I18N.uz;
  document.querySelectorAll('[di]').forEach(el=>{
    const k=el.getAttribute('di');
    if(t[k])el.textContent=t[k];
  });
  document.querySelectorAll('[di_ph]').forEach(el=>{
    const k=el.getAttribute('di_ph');
    if(t[k])el.placeholder=t[k];
  });
  ['btnUZ','btnRU','btnEN'].forEach(id=>document.getElementById(id).classList.remove('active'));
  const m={uz:'btnUZ',ru:'btnRU',en:'btnEN'};
  if(m[LANG])document.getElementById(m[LANG]).classList.add('active');
}

// ─── CARD RENDER ─────────────────────────────────────────────────────────────
function fmtBal(n){
  return Math.round(n).toLocaleString('ru-RU').replace(/ /g,' ');
}
function renderCard(){
  document.getElementById('cardBalance').textContent=fmtBal(BAL);
}

// ─── QUICK GRID ──────────────────────────────────────────────────────────────
function buildQuickGrid(){
  const g=document.getElementById('quickGrid');
  g.innerHTML='';
  QUICK_ITEMS.forEach((item,i)=>{
    const name=item['key_'+LANG]||item.key_en;
    const btn=document.createElement('button');
    btn.className='qbtn';
    btn.innerHTML=`<span class="qbtn-icon">${item.icon}</span><span class="qbtn-name">${name}</span><span class="qbtn-price">${fmtBal(item.price)} UZS</span>`;
    btn.onclick=()=>doQuickSpend(item,name);
    g.appendChild(btn);
  });
}

// ─── PRESETS ─────────────────────────────────────────────────────────────────
function buildPresets(){
  const g=document.getElementById('presetGrid');
  g.innerHTML='';
  TOPUP_PRESETS.forEach(p=>{
    const btn=document.createElement('button');
    btn.className='preset-btn';
    btn.textContent=fmtBal(p);
    btn.onclick=()=>{document.getElementById('topupInp').value=p;};
    g.appendChild(btn);
  });
}

// ─── TRANSACTIONS ─────────────────────────────────────────────────────────────
function renderTxns(){
  const list=document.getElementById('txnList');
  list.innerHTML='';
  const t=I18N[LANG]||I18N.uz;
  if(!TXNS.length){
    list.innerHTML=`<div class="empty-txn">${t.empty_txn}</div>`;
    return;
  }
  const sorted=[...TXNS].sort((a,b)=>b.ts-a.ts);
  sorted.forEach(tx=>{
    const titleKey='title_'+LANG;
    const title=tx[titleKey]||tx.title_uz||tx.title_en||'—';
    const isPos=tx.amount>0;
    const amtStr=(isPos?'+':'')+fmtBal(tx.amount)+' UZS';
    const date=new Date(tx.ts);
    const dateStr=date.toLocaleDateString(LANG==='uz'?'uz-Latn-UZ':LANG==='ru'?'ru-RU':'en-US',{day:'numeric',month:'short',year:'numeric'});
    const div=document.createElement('div');
    div.className='txn-item';
    div.innerHTML=`
      <div class="txn-icon">${tx.icon||'💰'}</div>
      <div class="txn-info">
        <div class="txn-title">${title}</div>
        <div class="txn-date">${dateStr}</div>
      </div>
      <div class="txn-amount ${isPos?'pos':'neg'}">${amtStr}</div>
    `;
    list.appendChild(div);
  });
}

// ─── SPEND ───────────────────────────────────────────────────────────────────
function doQuickSpend(item,name){
  const amt=item.price;
  const t=I18N[LANG]||I18N.uz;
  if(BAL<amt){showToast(t.toast_no_funds,'err');return;}
  BAL-=amt;
  saveBal();
  const titleKey='title_'+LANG;
  const tx={
    id:'q'+Date.now(),
    type:'expense',
    icon:item.icon,
    title_uz:item.key_uz+': '+t.toast_spent,
    title_ru:item.key_ru+': '+t.toast_spent,
    title_en:item.key_en+': '+t.toast_spent,
    amount:-amt,
    ts:Date.now()
  };
  // Use the localized name properly
  tx['title_uz']=item.key_uz;
  tx['title_ru']=item.key_ru;
  tx['title_en']=item.key_en;
  TXNS.unshift(tx);
  saveTxns();
  renderCard();
  renderTxns();
  showToast(`${fmtBal(amt)} UZS ${t.toast_spent}`,'ok');
}

function doCustomSpend(){
  const t=I18N[LANG]||I18N.uz;
  const v=parseFloat(document.getElementById('csInp').value);
  if(!v||v<1){showToast(t.toast_invalid,'err');return;}
  if(v<1000){showToast(t.toast_min,'err');return;}
  if(BAL<v){showToast(t.toast_no_funds,'err');return;}
  BAL-=v;
  saveBal();
  const tx={
    id:'c'+Date.now(),
    type:'expense',
    icon:'💸',
    title_uz:'To\'lov',
    title_ru:'Платёж',
    title_en:'Payment',
    amount:-v,
    ts:Date.now()
  };
  TXNS.unshift(tx);
  saveTxns();
  document.getElementById('csInp').value='';
  renderCard();
  renderTxns();
  showToast(`${fmtBal(v)} UZS ${t.toast_spent}`,'ok');
}

// ─── TOP UP ───────────────────────────────────────────────────────────────────
function openTopUp(){
  document.getElementById('topupModal').classList.add('open');
  setTimeout(()=>document.getElementById('topupInp').focus(),300);
}
function closeTopUp(e){
  if(e&&e.target!==document.getElementById('topupModal'))return;
  document.getElementById('topupModal').classList.remove('open');
  document.getElementById('topupInp').value='';
}
function doTopUp(){
  const t=I18N[LANG]||I18N.uz;
  const v=parseFloat(document.getElementById('topupInp').value);
  if(!v||v<1000){showToast(t.toast_min,'err');return;}
  BAL+=v;
  saveBal();
  const tx={
    id:'u'+Date.now(),
    type:'income',
    icon:'💳',
    title_uz:"Balans to'ldirildi",
    title_ru:'Баланс пополнен',
    title_en:'Balance topped up',
    amount:v,
    ts:Date.now()
  };
  TXNS.unshift(tx);
  saveTxns();
  document.getElementById('topupModal').classList.remove('open');
  document.getElementById('topupInp').value='';
  renderCard();
  renderTxns();
  showToast(`${fmtBal(v)} UZS ${t.toast_added}`,'ok');
}

// ─── TOAST ───────────────────────────────────────────────────────────────────
function showToast(msg,type='ok'){
  const wrap=document.getElementById('toastWrap');
  const d=document.createElement('div');
  d.className=`toast ${type}`;
  d.textContent=msg;
  wrap.appendChild(d);
  setTimeout(()=>{d.classList.add('out');setTimeout(()=>d.remove(),350);},2200);
}

// ─── KEYBOARD ────────────────────────────────────────────────────────────────
document.addEventListener('keydown',e=>{
  if(e.key==='Enter'){
    const modal=document.getElementById('topupModal');
    if(modal.classList.contains('open')){doTopUp();return;}
  }
  if(e.key==='Escape'){
    document.getElementById('topupModal').classList.remove('open');
  }
});

// ─── START ───────────────────────────────────────────────────────────────────
window.onload=init;
</script>
</body>
</html>
