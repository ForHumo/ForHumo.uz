<!doctype html>
<html lang="uz">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Offline — For Humo</title>
    <style>
        html, body {
            margin: 0; padding: 0; min-height: 100vh;
            background: #0F0F10; color: #F7F7F7;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            display: flex; align-items: center; justify-content: center;
            padding: 24px;
        }
        .box {
            max-width: 340px; text-align: center;
        }
        .icon {
            width: 150px; height: 150px;
            display: inline-flex; align-items: center; justify-content: center;
            margin-bottom: 14px;
        }
        .icon img { width: 150px; height: 150px; object-fit: contain; filter: drop-shadow(0 10px 24px rgba(0,0,0,0.45)); }
        h1 { font-size: 22px; font-weight: 900; margin: 0 0 8px; letter-spacing: -0.02em; }
        p { font-size: 14px; line-height: 1.5; color: #B8B8B8; margin: 0 0 24px; }
        button {
            background: #F5B301; color: #0A0A0A;
            border: none; border-radius: 12px;
            padding: 12px 24px;
            font-size: 14px; font-weight: 900;
            cursor: pointer;
        }
        button:active { transform: scale(0.97); }
    </style>
</head>
<body>
    <div class="box">
        <div class="icon">
            <img src="/mascot/ummi.webp" alt="Ummi" />
        </div>
        <h1>Internet yo'q</h1>
        <p>Ulanish tiklangach yana urinib ko'ring. Ilgari ochgan sahifalar hozircha ochiq.</p>
        <button onclick="location.reload()">Qayta urinish</button>
    </div>
</body>
</html>
