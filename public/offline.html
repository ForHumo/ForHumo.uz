<!doctype html>
<html lang="uz">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Offline — For Humo</title>
    <style>
        html, body {
            margin: 0; padding: 0; min-height: 100vh;
            background: #0F0F10; color: #F7F7F7;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            display: flex; align-items: center; justify-content: center;
            padding: 24px;
        }
        .box {
            max-width: 340px; text-align: center;
        }
        .icon {
            width: 64px; height: 64px; border-radius: 16px;
            background: rgba(245, 179, 1, 0.15);
            display: inline-flex; align-items: center; justify-content: center;
            margin-bottom: 20px;
            color: #F5B301;
        }
        h1 { font-size: 22px; font-weight: 900; margin: 0 0 8px; letter-spacing: -0.02em; }
        p { font-size: 14px; line-height: 1.5; color: #B8B8B8; margin: 0 0 24px; }
        button {
            background: #F5B301; color: #0A0A0A;
            border: none; border-radius: 12px;
            padding: 12px 24px;
            font-size: 14px; font-weight: 900;
            cursor: pointer;
        }
        button:active { transform: scale(0.97); }
    </style>
</head>
<body>
    <div class="box">
        <div class="icon">
            <svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                <path d="M17 18a5 5 0 0 0-10 0"/><line x1="12" y1="9" x2="12" y2="2"/><line x1="4.22" y1="10.22" x2="5.64" y2="11.64"/><line x1="1" y1="18" x2="3" y2="18"/><line x1="21" y1="18" x2="23" y2="18"/><line x1="18.36" y1="11.64" x2="19.78" y2="10.22"/><line x1="23" y1="22" x2="1" y2="2"/>
            </svg>
        </div>
        <h1>Internet yo'q</h1>
        <p>Ulanish tiklangach yana urinib ko'ring. Ilgari ochgan sahifalar hozircha ochiq.</p>
        <button onclick="location.reload()">Qayta urinish</button>
    </div>
</body>
</html>
